name: CI

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "environment.js"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx eslint src/app.js src/**/*.js

      - run: npx ava
        env:
          NODE_ENV: test
